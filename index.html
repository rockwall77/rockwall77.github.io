<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>妖月阁｜唯一官方发布页</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .panel {
      background-color: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 24px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
      padding: 48px;
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    header {
      font-size: 16px;
      letter-spacing: 0.08em;
      color: #1d1d1f;
      margin-bottom: 32px;
      font-weight: 600;
    }

    h1 {
      font-size: 52px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin: 0 0 16px;
      color: #1d1d1f;
    }

    .subtitle {
      font-size: 19px;
      color: #6e6e73;
      margin: 0 0 48px;
      line-height: 1.4;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 40px;
    }

    .btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 52px;
      padding: 0 24px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 500;
      transition: all 180ms ease;
      cursor: pointer;
      border: none;
      gap: 4px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
    }

    .btn-primary {
      background-color: #0071e3;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 113, 227, 0.12);
    }

    .btn-secondary {
      border: 1px solid #0071e3;
      color: #0071e3;
      background-color: transparent;
    }

    .btn-secondary:hover {
      background-color: rgba(0, 113, 227, 0.02);
    }

    .btn-gray {
      border: 1px solid #d2d2d7;
      color: #1d1d1f;
      background-color: transparent;
    }

    .btn-gray:hover {
      background-color: rgba(0, 0, 0, 0.02);
    }

    .btn-name {
      font-size: 16px;
      font-weight: 600;
    }

    .btn-domain {
      font-size: 12px;
      opacity: 0.7;
    }

    .alert {
      background-color: #ffffff;
      border: 1px solid #e5e5ea;
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      margin-bottom: 40px;
    }

    .alert-title {
      font-size: 14px;
      font-weight: 600;
      color: #1d1d1f;
      margin: 0 0 12px;
    }

    .alert-text {
      font-size: 14px;
      color: #6e6e73;
      margin: 0;
      line-height: 1.6;
    }

    footer {
      font-size: 12px;
      color: #6e6e73;
      line-height: 1.6;
      margin-top: 16px;
    }

    @media (max-width: 480px) {
      .panel {
        padding: 28px;
      }

      h1 {
        font-size: 38px;
      }

      .subtitle {
        font-size: 16px;
        margin-bottom: 40px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="panel">
    <header>妖月阁 · 官方入口</header>

    <h1>唯一入口</h1>
    <p class="subtitle">备用网址变更将仅在此发布</p>

    <div class="button-group">
      <a href="https://home.yyg.ink" class="btn btn-primary" target="_blank" rel="noopener">
        <span class="btn-name">官方网站</span>
        <span class="btn-domain">home.yyg.ink</span>
      </a>

      <a href="https://www.aiyaoyue.com" class="btn btn-secondary" target="_blank" rel="noopener">
        <span class="btn-name">仅大陆内地访问入口</span>
        <span class="btn-domain">cdn.aiyaoyue.net</span>
      </a>

      <a href="https://t.me/yaoyuege" class="btn btn-gray" target="_blank" rel="noopener">
        <span class="btn-name">加入社区</span>
        <span class="btn-domain">Telegram</span>
      </a>
    </div>

    <footer>
      <p>桌面 Ctrl+D / 手机加入书签。<br>如需帮助请使用右下角客服。</p>
    </footer>
  </div>

  <script type="text/javascript">window.$crisp=[];window.CRISP_WEBSITE_ID="d0d6ca6d-d845-4fbf-b331-ee34c512112b";(function(){d=document;s=d.createElement("script");s.src="https://client.crisp.chat/l.js";s.async=1;d.getElementsByTagName("head")[0].appendChild(s);})();</script>
</body>
</html>
