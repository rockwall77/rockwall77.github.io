<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>妖月阁 · 永久发布页（必收藏）</title>
  <meta name="description" content="妖月阁最新永久发布页，大陆/海外双线路，建议立即Ctrl+D收藏">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@900&family=Ma+Shan+Zheng&display=swap');
    
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Noto Sans SC', sans-serif;
      height:100vh;
      background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
      color:#fff;
      overflow:hidden;
      position:relative;
    }
    #particles-js{
      position:absolute;
      width:100%;
      height:100%;
    }
    .main{
      position:relative;
      z-index:2;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px;
    }
    .box{
      background:rgba(0,0,0,0.65);
      backdrop-filter:blur(10px);
      border:2px solid #ff3366;
      border-radius:20px;
      padding:50px 40px;
      max-width:660px;
      box-shadow:0 0 50px rgba(255,51,102,0.6);
    }
    h1{
      font-family:'Ma Shan Zheng',cursive;
      font-size:5.5rem;
      background:linear-gradient(90deg,#ff3366,#ff6b9d,#c93fff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom:20px;
      text-shadow:0 0 30px rgba(255,51,102,0.8);
    }
    .warn{
      font-size:2rem;
      font-weight:900;
      color:#ff3366;
      text-shadow:0 0 15px #ff3366;
      margin:30px 0;
      animation:pulse 2s infinite;
    }
    .tip{
      font-size:1.3rem;
      color:#fff;
      margin:20px 0;
      line-height:1.8;
    }
    .btns{
      margin-top:40px;
      display:flex;
      flex-direction:column;
      gap:20px;
      align-items:center;
    }
    .btn{
      display:block;
      width:360px;
      padding:18px;
      font-size:1.4rem;
      font-weight:900;
      text-decoration:none;
      border-radius:50px;
      transition:all 0.4s;
      box-shadow:0 8px 25px rgba(0,0,0,0.4);
    }
    .btn-oversea{
      background:#ff3366;
      color:#fff;
    }
    .btn-oversea:hover{
      background:#ff5478;
      transform:scale(1.08);
    }
    .btn-mainland{
      background:#00d4ff;
      color:#000;
    }
    .btn-mainland:hover{
      background:#33ddff;
      transform:scale(1.08);
    }
    .btn-tg{
      background:#0088cc;
      color:#fff;
    }
    .btn-tg:hover{
      background:#0099ee;
      transform:scale(1.08);
    }
    @keyframes pulse{
      0%,100%{opacity:1}
      50%{opacity:0.7}
    }
    .footer{
      position:absolute;
      bottom:20px;
      width:100%;
      color:#888;
      font-size:0.9rem;
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>
  
  <div class="main">
    <div class="box">
      <h1>妖月阁</h1>
      
      <div class="warn">大陆用户必须 Ctrl+D 收藏本页！</div>
      
      <div class="tip">
        最新官网随时可能被墙<br>
        <strong style="color:#ff3366">只有这里永远能找到我们！</strong>
      </div>
      
      <div class="btns">
        <a href="https://home.yyg.ink" target="_blank" class="btn btn-oversea">🚀 海外高速线路（推荐）</a>
        <a href="https://www.aiyaoyue.com" target="_blank" class="btn btn-mainland">🇨🇳 大陆优化线路</a>
        <a href="https://t.me/yaoyuege" target="_blank" class="btn btn-tg">✈️ TG交流群（重要通知都在这）</a>
      </div>
    </div>
  </div>
  
  <div class="footer">妖月阁永久发布页 · 建议使用 Chrome / Firefox 访问</div>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS("particles-js", {
      "particles": {
        "number": {"value": 80},
        "color": {"value": "#ff3366"},
        "shape": {"type": "circle"},
        "opacity": {"value": 0.6,"random": true},
        "size": {"value": 3,"random": true},
        "line_linked": {"enable": true,"distance": 150,"color": "#ff3366","opacity": 0.4,"width": 1},
        "move": {"enable": true,"speed": 3}
      },
      "interactivity": {
        "events": {
          "onhover": {"enable": true,"mode": "repulse"},
          "onclick": {"enable": true,"mode": "push"}
        }
      },
      "retina_detect": true
    });
  </script>
</body>
</html>
